<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Ekstrakurikuler</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS sendiri -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">

    <div class="card form-card shadow-lg border-0">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold">Pendaftaran Ekstrakurikuler</h2>
                <p class="text-muted">
                    Silakan isi data untuk mendaftar sebagai anggota baru.
                </p>
            </div>

            <form id="registrationForm" novalidate>

                <!-- Nama -->
                <div class="mb-3">
                    <label for="nama" class="form-label fw-semibold">
                        Nama Lengkap
                    </label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="nama"
                        placeholder="Masukkan nama lengkap"
                    >
                    <div class="invalid-feedback">
                        Nama minimal 3 karakter dan tidak boleh kosong.
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">
                        Email
                    </label>
                    <input 
                        type="email" 
                        class="form-control" 
                        id="email"
                        placeholder="contoh@email.com"
                    >
                    <div class="invalid-feedback">
                        Masukkan alamat email yang valid.
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">
                        Password
                    </label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="password"
                        placeholder="Minimal 8 karakter"
                    >
                    <div class="invalid-feedback">
                        Password minimal 8 karakter.
                    </div>
                </div>

                <!-- Konfirmasi Password -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label fw-semibold">
                        Konfirmasi Password
                    </label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="confirmPassword"
                        placeholder="Masukkan ulang password"
                    >
                    <div class="invalid-feedback">
                        Konfirmasi password harus sama.
                    </div>
                </div>

                <!-- Ekstrakurikuler -->
                <div class="mb-4">
                    <label for="ekskul" class="form-label fw-semibold">
                        Pilihan Ekstrakurikuler
                    </label>

                    <select class="form-select" id="ekskul">
                        <option value="">-- Pilih Ekstrakurikuler --</option>
                        <option value="Pramuka">Pramuka</option>
                        <option value="Paskibra">Paskibra</option>
                        <option value="PMR">PMR</option>
                        <option value="Voly">Voly</option>
                        <option value="Futsal">Futsal</option>
                        <option value="Tari">Tari</option>
                        <option value="Rebana">Rebana</option>
                        <option value="Rohis">Rohis</option>
                        <option value="Foster">Foster</option>
                        <option value="Jepang">Jepang</option>
                        <option value="Jurnalis">Jurnalis</option>
                        <option value="MTQ">MTQ</option>
                        <option value="drumband">Drumband</option>
                        <option value="Pencak Silat">Pencak Silat</option>
                        <option value="Paduan Suara">Paduan Suara</option>
                    </select>

                    <div class="invalid-feedback">
                        Silakan pilih ekstrakurikuler.
                    </div>
                </div>

                <!-- Tombol -->
                <button type="submit" class="btn btn-primary w-100 py-2">
                    Daftar Sekarang
                </button>

                <!-- Pesan sukses -->
                <div id="successMessage" class="alert alert-success mt-3 d-none">
                    Pendaftaran Berhasil!
                </div>

            </form>

        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
